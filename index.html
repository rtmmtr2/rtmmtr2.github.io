<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>工具主页</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      padding: 2rem;
    }
    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }
    .menu a button {
      width: 180px;
      height: 60px;
      font-size: 16px;
      border-radius: 0; /* 方形 */
      border: 2px solid #444;
      background-color: #eee;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .menu a button:hover {
      background-color: #ccc;
    }
    #theme-button {
      margin-top: 2rem;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 0;
      border: 2px solid #444;
      background: #eee;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>多功能工具主页</h1>
  <div class="menu">
    <a href="pages/clock.html"><button>北京时间</button></a>
    <a href="pages/stopwatch.html"><button>秒表</button></a>
    <a href="pages/random.html"><button>随机抽选</button></a>
    <a href="pages/alarm.html"><button>闹钟</button></a>
    <a href="pages/function.html"><button>函数绘图</button></a>
  </div>

  <button id="theme-button" onclick="toggleTheme()">切换主题</button>

  <script>
    let themes = ["", "light", "blue", "light-blue", "light-black"];
    let currentThemeIndex = 0;
    function toggleTheme() {
      document.body.classList.remove(...themes);
      currentThemeIndex = (currentThemeIndex + 1) % themes.length;
      const theme = themes[currentThemeIndex];
      if (theme) {
        document.body.classList.add(theme);
        localStorage.setItem("theme", theme);
      } else {
        localStorage.removeItem("theme");
      }
    }

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.body.classList.add(savedTheme);
      currentThemeIndex = themes.indexOf(savedTheme);
    }
  </script>
</body>
</html>
