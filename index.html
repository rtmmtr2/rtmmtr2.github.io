<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>多功能工具箱</title>
  <link rel="icon" href="chest.png" type="image/png">
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      padding: 2rem;
      background-color: #fff;
      color: #000;
      transition: background-color 0.3s, color 0.3s;
    }
    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }
    .btn {
      width: 160px;
      height: 50px;
      font-size: 16px;
      border-radius: 0;          /* 方形 */
      border: 2px solid currentColor;  /* 边框颜色和文字颜色一致 */
      background-color: transparent;
      color: inherit;            /* 继承 body 颜色 */
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
    }
    .btn:hover {
      background-color: currentColor;
      color: var(--btn-hover-text, #fff);
    }
    #theme-button {
      margin-top: 2rem;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 0;
      border: 2px solid currentColor;
      background: transparent;
      color: inherit;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
    }
    #theme-button:hover {
      background-color: currentColor;
      color: var(--btn-hover-text, #fff);
    }

  </style>
</head>
<body>
  <h1>多功能工具主页</h1>
  <h2>时间工具</h2>
  <div class="menu">
    <a href="pages/clock.html"><button class="btn">北京时间</button></a>
    <a href="pages/stopwatch.html"><button class="btn">秒表</button></a>
    <a href="pages/alarm.html"><button class="btn">闹钟</button></a>
  </div>

  <h2>数学工具</h2>
  <div class="menu">
    <a href="pages/unit_converter.html"><button class="btn">单位换算</button></a>
    <a href="pages/function.html"><button class="btn">函数绘图</button></a>
    <a href="pages/quadratic_function.html"><button class="btn">二次函数求解</button></a>
  </div>
  <h2>编程工具</h2>
  <div class="menu">
    <a href="pages/rgb_to_hex.html"><button class="btn">RGB 转 HEX</button></a>
    <a href="pages/qrcode.html"><button class="btn">二维码生成</button></a>
  </div>
  <h2>其他工具</h2>
    <div class="menu">
    <a href="pages/random.html"><button class="btn">随机抽选</button></a>
  </div>

  <button id="theme-button" onclick="toggleTheme()">切换主题</button>

  <script>
    const themes = ["theme-white-blue", "theme-white-red", "theme-white-black", "theme-black-green","theme-black-blue","theme-black-white"];

    let currentThemeIndex = 0;

    function toggleTheme() {
      themes.forEach(t => document.body.classList.remove(t));
      currentThemeIndex = (currentThemeIndex + 1) % (themes.length + 1);
      if (currentThemeIndex === themes.length) {
        // 无主题，移除所有主题类
        localStorage.removeItem("theme");
      } else {
        document.body.classList.add(themes[currentThemeIndex]);
        localStorage.setItem("theme", themes[currentThemeIndex]);
      }
    }

    window.onload = () => {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme && themes.includes(savedTheme)) {
        document.body.classList.add(savedTheme);
        currentThemeIndex = themes.indexOf(savedTheme);
      }
    };
  </script>
</body>
</html>
