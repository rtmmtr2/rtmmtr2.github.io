<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>LED 多功能北京时间</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/dseg-fonts/webfont/dseg.css" rel="stylesheet" />

  <style>
    :root {
      --led-color: #0f0;
    }

    body {
      background-color: #000;
      color: var(--led-color);
      margin: 0;
      font-family: 'DSEG7Classic-Bold', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2em;
    }

    .clock {
      font-size: 10vw;
      letter-spacing: 0.1em;
      text-align: center;
    }

    .date {
      font-size: 5vw;
      margin-top: 1em;
      margin-bottom: 1.5em;
      text-align: center;
    }

    .buttons, .countdown-input {
      margin: 1em 0;
      text-align: center;
    }

    button {
      font-size: 1em;
      margin: 0.3em;
      padding: 0.5em 1em;
      background: #111;
      border: 2px solid var(--led-color);
      color: var(--led-color);
      cursor: pointer;
    }

    button:hover {
      background: #222;
    }

    input[type="number"] {
      width: 4em;
      text-align: center;
      font-size: 1em;
      margin: 0 0.3em;
    }

    .section {
      margin-top: 2em;
      text-align: center;
      max-width: 90vw;
    }

    .label {
      font-size: 1.5em;
      margin-bottom: 0.5em;
    }

    .led-display {
      font-size: 2.5em;
      margin-bottom: 0.5em;
    }

    @media (max-width: 600px) {
      .led-display {
        font-size: 6vw;
      }

      .clock {
        font-size: 15vw;
      }

      .date {
        font-size: 6vw;
      }

      input[type="number"] {
        width: 3em;
      }
    }
  </style>
</head>
<body>
  <div class="clock" id="clock">88:88:88</div>
  <div class="date" id="date">加载中...</div>
  <div class="buttons">
    <button onclick="toggleFormat()">切换12/24小时制</button>
    <button onclick="cycleColor()">切换颜色</button>
  </div>

  <div class="section">
    <div class="label">秒表</div>
    <div class="led-display" id="stopwatch">00:00:00</div>
    <div class="buttons">
      <button onclick="startStopwatch()">开始</button>
      <button onclick="pauseStopwatch()">暂停</button>
      <button onclick="resetStopwatch()">重置</button>
    </div>
  </div>

  <div class="section">
    <div class="label">倒计时</div>
    <div class="led-display" id="countdown">00:00:00</div>
    <div class="countdown-input">
      <input type="number" id="cd-h" min="0" placeholder="小时">
      <input type="number" id="cd-m" min="0" max="59" placeholder="分钟">
      <input type="number" id="cd-s" min="0" max="59" placeholder="秒钟">
    </div>
    <div class="buttons">
      <button onclick="startCountdown()">开始倒计时</button>
      <button onclick="resetCountdown()">重置</button>
    </div>
  </div>

  <audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

  <script>
    let use12Hour = false;
    let ledColors = ['#0f0', '#f00', '#0af'];
    let currentColorIndex = 0;

    function updateTime() {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      const bj = new Date(utc + 8 * 3600000);

      let h = bj.getHours();
      const m = String(bj.getMinutes()).padStart(2, '0');
      const s = String(bj.getSeconds()).padStart(2, '0');
      if (use12Hour) h = h % 12 || 12;
      h = String(h).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;

      const y = bj.getFullYear();
      const mo = String(bj.getMonth() + 1).padStart(2, '0');
      const d = String(bj.getDate()).padStart(2, '0');
      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      const wd = weekdays[bj.getDay()];
      document.getElementById('date').textContent = `${y}-${mo}-${d} 星期${wd}`;
    }

    function toggleFormat() {
      use12Hour = !use12Hour;
    }

    function cycleColor() {
      currentColorIndex = (currentColorIndex + 1) % ledColors.length;
      document.documentElement.style.setProperty('--led-color', ledColors[currentColorIndex]);
    }

    setInterval(updateTime, 1000);
    updateTime();

    // 秒表功能
    let stopwatchTime = 0;
    let stopwatchInterval = null;

    function updateStopwatch() {
      const h = String(Math.floor(stopwatchTime / 3600)).padStart(2, '0');
      const m = String(Math.floor((stopwatchTime % 3600) / 60)).padStart(2, '0');
      const s = String(stopwatchTime % 60).padStart(2, '0');
      document.getElementById('stopwatch').textContent = `${h}:${m}:${s}`;
    }

    function startStopwatch() {
      if (!stopwatchInterval) {
        stopwatchInterval = setInterval(() => {
          stopwatchTime++;
          updateStopwatch();
        }, 1000);
      }
    }

    function pauseStopwatch() {
      clearInterval(stopwatchInterval);
      stopwatchInterval = null;
    }

    function resetStopwatch() {
      stopwatchTime = 0;
      pauseStopwatch();
      updateStopwatch();
    }

    // 倒计时功能
    let countdownTime = 0;
    let countdownInterval = null;

    function updateCountdown() {
      const h = String(Math.floor(countdownTime / 3600)).padStart(2, '0');
      const m = String(Math.floor((countdownTime % 3600) / 60)).padStart(2, '0');
      const s = String(countdownTime % 60).padStart(2, '0');
      document.getElementById('countdown').textContent = `${h}:${m}:${s}`;
    }

    function startCountdown() {
      const h = parseInt(document.getElementById('cd-h').value) || 0;
      const m = parseInt(document.getElementById('cd-m').value) || 0;
      const s = parseInt(document.getElementById('cd-s').value) || 0;
      countdownTime = h * 3600 + m * 60 + s;
      updateCountdown();

      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        if (countdownTime > 0) {
          countdownTime--;
          updateCountdown();
        } else {
          clearInterval(countdownInterval);
          countdownInterval = null;
          updateCountdown();
          document.getElementById('beep').play();
          alert('倒计时结束！');
        }
      }, 1000);
    }

    function resetCountdown() {
      countdownTime = 0;
      clearInterval(countdownInterval);
      countdownInterval = null;
      updateCountdown();
    }

    updateStopwatch();
    updateCountdown();
  </script>
</body>
</html>
