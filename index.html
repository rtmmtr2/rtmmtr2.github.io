<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>北京时间 - 方形LED数字</title>
  <!-- 使用 DSEG7 经典风格 -->
  <link href="https://cdn.jsdelivr.net/npm/dseg-fonts/webfont/dseg.css" rel="stylesheet" />

  <style>
    body {
      background-color: #000;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .clock {
      font-family: 'DSEG7Classic-Bold', monospace;
      font-size: 6em;
      color: #0f0;
      text-shadow:
        0 0 3px #0f0,
        0 0 5px #0f0,
        0 0 10px #0f0,
        0 0 20px #0f0;
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% {
        text-shadow:
          0 0 3px #0f0,
          0 0 5px #0f0,
          0 0 10px #0f0,
          0 0 20px #0f0;
      }
      50% {
        text-shadow:
          0 0 1px #0f0,
          0 0 2px #0f0,
          0 0 5px #0f0;
      }
    }
  </style>
</head>
<body>
  <div class="clock" id="clock">88:88:88</div>

  <script>
    function updateClock() {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      const beijingTime = new Date(utc + 8 * 60 * 60 * 1000);

      const hours = String(beijingTime.getHours()).padStart(2, '0');
      const minutes = String(beijingTime.getMinutes()).padStart(2, '0');
      const seconds = String(beijingTime.getSeconds()).padStart(2, '0');

      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
