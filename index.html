<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>LED 工具集</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>LED 风格工具集</h1>
  <div>
    <button onclick="location.href='pages/clock.html'">北京时间</button>
    <button onclick="location.href='pages/stopwatch.html'">秒表</button>
    <button onclick="location.href='pages/random.html'">随机抽选</button>
    <button onclick="location.href='pages/alarm.html'">闹钟</button>
  </div>
  <button onclick="toggleTheme()">切换主题</button>
  <script>
    let themes = ["", "light", "blue", "light-blue", "light-black"];
    let currentThemeIndex = 0;
    function toggleTheme() {
      document.body.classList.remove(...themes);
      currentThemeIndex = (currentThemeIndex + 1) % themes.length;
      const theme = themes[currentThemeIndex];
      if (theme) {
        document.body.classList.add(theme);
        localStorage.setItem("theme", theme);
      } else {
        localStorage.removeItem("theme");
      }
    }

    // 初始化主题
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.body.classList.add(savedTheme);
      currentThemeIndex = themes.indexOf(savedTheme);
    }
  </script>
</body>
</html>
