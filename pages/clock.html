<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>北京时间</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1 id="clock">00:00:00</h1>
  <h2 id="date">0000-00-00</h2>
  <button onclick="toggleTheme()">切换主题</button>
  <div style="margin-top: 2em;"><a href="../index.html"><button>返回主页</button></a></div>
  <script>
    function updateClock() {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      const bj = new Date(utc + 8 * 3600000);
      const time = bj.toTimeString().split(" ")[0];
      const date = bj.toISOString().split("T")[0];
      document.getElementById("clock").textContent = time;
      document.getElementById("date").textContent = date;
    }
    setInterval(updateClock, 1000);
    updateClock();

    let themes = ["", "light", "blue", "light-blue", "light-black"];
    let currentThemeIndex = 0;
    function toggleTheme() {
      document.body.classList.remove(...themes);
      currentThemeIndex = (currentThemeIndex + 1) % themes.length;
      if (themes[currentThemeIndex]) {
        document.body.classList.add(themes[currentThemeIndex]);
      }
    }
  </script>
</body>
</html>...
