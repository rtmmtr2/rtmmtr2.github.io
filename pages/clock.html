<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>北京时间</title>
  <link rel="icon" href="../chest.png" type="image/png">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1 id="clock">00:00:00</h1>
  <h2 id="date">0000-00-00</h2>
  <button onclick="toggleTheme()">切换主题</button>
  <div><a href="../index.html"><button>返回主页</button></a></div>
  <script>
    function updateClock() {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      const bj = new Date(utc + 8 * 3600000);
      document.getElementById("clock").textContent = bj.toTimeString().split(" ")[0];
      document.getElementById("date").textContent = bj.toISOString().split("T")[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    let themes = ["theme-white-blue", "theme-white-red", "theme-white-black", "theme-black-green","theme-black-blue","theme-black-white"];
    let currentThemeIndex = 0;
    function toggleTheme() {
      document.body.classList.remove(...themes);
      currentThemeIndex = (currentThemeIndex + 1) % themes.length;
      const theme = themes[currentThemeIndex];
      if (theme) {
        document.body.classList.add(theme);
        localStorage.setItem("theme", theme);
      } else {
        localStorage.removeItem("theme");
      }
    }

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.body.classList.add(savedTheme);
      currentThemeIndex = themes.indexOf(savedTheme);
    }
  </script>
</body>
</html>
