<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>二维码生成器</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      text-align: center;
      transition: background-color 0.3s, color 0.3s;
    }

    input[type="text"] {
      width: 300px;
      padding: 8px;
      font-size: 16px;
      margin: 10px 0;
    }

    canvas {
      margin: 1rem auto;
    }

    .btn {
      margin: 10px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 0;
      border: 2px solid currentColor;
      background: transparent;
      color: inherit;
      transition: background-color 0.3s, color 0.3s;
    }

    .btn:hover {
      background-color: currentColor;
      color: var(--btn-hover-text, #fff);
    }
  </style>
</head>
<body>
  <h1>二维码生成器</h1>

  <input type="text" id="qrText" placeholder="输入内容或网址" value="https://example.com" />
  <br />
  <button class="btn" onclick="generateQR()">生成二维码</button>
  <button class="btn" onclick="downloadQR()">保存二维码</button>
  <button class="btn" onclick="copyQR()">复制二维码链接</button>
  <br />
  <canvas id="qrCanvas"></canvas>

  <a href="../index.html"><button class="btn">返回主页</button></a>
  <button class="btn" onclick="toggleTheme()">切换主题</button>

  <script>
    function generateQR() {
      const text = document.getElementById("qrText").value.trim();
      const canvas = document.getElementById("qrCanvas");

      if (!text) {
        alert("请输入要生成二维码的内容！");
        return;
      }

      QRCode.toCanvas(canvas, text, { errorCorrectionLevel: 'H', width: 200 }, function (error) {
        if (error) console.error(error);
      });
    }

    function downloadQR() {
      const canvas = document.getElementById("qrCanvas");
      const link = document.createElement("a");
      link.download = "qrcode.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function copyQR() {
      const text = document.getElementById("qrText").value.trim();
      if (text) {
        navigator.clipboard.writeText(text).then(() => {
          alert("内容已复制到剪贴板！");
        });
      }
    }

    // 主题切换逻辑
    const themes = ["theme-white-blue", "theme-white-red", "theme-white-black", "theme-black-green", "theme-black-blue", "theme-black-white"];
    let currentThemeIndex = 0;

    function toggleTheme() {
      document.body.classList.remove(...themes);
      currentThemeIndex = (currentThemeIndex + 1) % (themes.length + 1);
      if (currentThemeIndex === themes.length) {
        localStorage.removeItem("theme");
      } else {
        const theme = themes[currentThemeIndex];
        document.body.classList.add(theme);
        localStorage.setItem("theme", theme);
      }
    }

    window.onload = () => {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme && themes.includes(savedTheme)) {
        document.body.classList.add(savedTheme);
        currentThemeIndex = themes.indexOf(savedTheme);
      }
      generateQR(); // 默认生成一个初始二维码
    };
  </script>
</body>
</html>
