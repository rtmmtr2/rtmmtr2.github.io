<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>二维码生成器</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      text-align: center;
      transition: background-color 0.3s, color 0.3s;
    }

    input[type="text"] {
      width: 300px;
      padding: 8px;
      font-size: 16px;
      margin: 10px 0;
    }

    .btn {
      margin: 10px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 0;
      border: 2px solid currentColor;
      background: transparent;
      color: inherit;
      transition: background-color 0.3s, color 0.3s;
    }

    .btn:hover {
      background-color: currentColor;
      color: var(--btn-hover-text, #fff);
    }

    #qrImage {
      margin-top: 1rem;
      width: 200px;
      height: 200px;
    }
  </style>
</head>
<body>
  <h1>二维码生成器</h1>

  <input type="text" id="qrText" placeholder="输入内容或网址" value="https://example.com" />
  <br />
  <button class="btn" onclick="generateQR()">生成二维码</button>
  <button class="btn" onclick="downloadQR()">保存二维码</button>
  <button class="btn" onclick="copyQR()">复制内容</button>
  <br />

  <img id="qrImage" alt="二维码预览" />

  <br />
  <a href="../index.html"><button class="btn">返回主页</button></a>
  <button class="btn" onclick="toggleTheme()">切换主题</button>

  <script>
    const qrImage = document.getElementById("qrImage");

    function generateQR() {
      const text = document.getElementById("qrText").value.trim();
      if (!text) {
        alert("请输入内容！");
        return;
      }

      QRCode.toDataURL(text, { errorCorrectionLevel: "H", width: 200 }, (err, url) => {
        if (err) {
          console.error("二维码生成失败：", err);
          alert("生成二维码失败！");
          return;
        }

        qrImage.src = url;
      });
    }

    function downloadQR() {
      if (!qrImage.src) {
        alert("请先生成二维码！");
        return;
      }
      const link = document.createElement("a");
      link.href = qrImage.src;
      link.download = "qrcode.png";
      link.click();
    }

    function copyQR() {
      const text = document.getElementById("qrText").value.trim();
      if (text) {
        navigator.clipboard.writeText(text).then(() => {
          alert("内容已复制到剪贴板！");
        });
      }
    }

    const themes = [
      "theme-white-blue", "theme-white-red", "theme-white-black",
      "theme-black-green", "theme-black-blue", "theme-black-white"
    ];
    let currentThemeIndex = 0;

    function toggleTheme() {
      document.body.classList.remove(...themes);
      currentThemeIndex = (currentThemeIndex + 1) % (themes.length + 1);
      if (currentThemeIndex === themes.length) {
        localStorage.removeItem("theme");
      } else {
        const theme = themes[currentThemeIndex];
        document.body.classList.add(theme);
        localStorage.setItem("theme", theme);
      }
    }

    window.onload = () => {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme && themes.includes(savedTheme)) {
        document.body.classList.add(savedTheme);
        currentThemeIndex = themes.indexOf(savedTheme);
      }
      generateQR(); // 默认生成
    };
  </script>
</body>
</html>
