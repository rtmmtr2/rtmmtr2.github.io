<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>二维码生成器</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/lib/browser.min.js"></script>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      padding: 2rem;
    }
    input {
      padding: 8px;
      width: 300px;
      font-size: 16px;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }
    img {
      margin-top: 20px;
      width: 200px;
      height: 200px;
    }
  </style>
</head>
<body>
  <h1>二维码生成器</h1>
  <input type="text" id="qrText" value="https://example.com" placeholder="输入内容">
  <br>
  <button onclick="generateQR()">生成二维码</button>
  <img id="qrImage" alt="二维码">

  <script>
    function generateQR() {
      const text = document.getElementById("qrText").value.trim();
      const img = document.getElementById("qrImage");

      if (!text) {
        alert("请输入内容！");
        return;
      }

      QRCode.toDataURL(text, { width: 200 }, (err, url) => {
        if (err) {
          console.error(err);
          alert("生成二维码失败");
          return;
        }
        img.src = url;
      });
    }

    // 页面加载时默认生成一次
    window.onload = generateQR;
  </script>
</body>
</html>
