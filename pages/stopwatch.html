<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>秒表（毫秒）</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1>秒表（毫秒）</h1>
  <div id="stopwatch" style="font-size: 10vw;">00:00:00.000</div>
  <div>
    <button onclick="start()">开始</button>
    <button onclick="pause()">暂停</button>
    <button onclick="reset()">重置</button>
  </div>
  <script>
    let startTime = 0, elapsed = 0, running = false, interval;

    function format(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const s = String(totalSeconds % 60).padStart(2, '0');
      const msPart = String(ms % 1000).padStart(3, '0');
      return `${h}:${m}:${s}.${msPart}`;
    }

    function update() {
      const now = performance.now();
      const current = running ? now - startTime + elapsed : elapsed;
      document.getElementById('stopwatch').textContent = format(Math.floor(current));
    }

    function start() {
      if (!running) {
        startTime = performance.now();
        interval = setInterval(update, 30);
        running = true;
      }
    }

    function pause() {
      if (running) {
        elapsed += performance.now() - startTime;
        clearInterval(interval);
        running = false;
        update();
      }
    }

    function reset() {
      clearInterval(interval);
      running = false;
      elapsed = 0;
      update();
    }

    update();
  </script>
</body>
</html>
