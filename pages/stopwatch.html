<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>秒表</title>
  <link rel="icon" href="../chest.png" type="image/png">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1 id="display">00:00:000</h1>
  <button onclick="start()">开始</button>
  <button onclick="stop()">停止</button>
  <button onclick="reset()">重置</button>
  <button onclick="toggleTheme()">切换主题</button>
  <div><a href="../index.html"><button>返回主页</button></a></div>
  <script>
    let startTime, timerInterval;
    function start() {
      startTime = Date.now() - (window.elapsed || 0);
      timerInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        window.elapsed = elapsed;
        const m = String(Math.floor(elapsed / 60000)).padStart(2, '0');
        const s = String(Math.floor((elapsed % 60000) / 1000)).padStart(2, '0');
        const ms = String(elapsed % 1000).padStart(3, '0');
        document.getElementById("display").textContent = `${m}:${s}:${ms}`;
      }, 30);
    }
    function stop() {
      clearInterval(timerInterval);
    }
    function reset() {
      clearInterval(timerInterval);
      window.elapsed = 0;
      document.getElementById("display").textContent = "00:00:000";
    }

    let themes = ["theme-white-blue", "theme-white-red", "theme-white-black", "theme-black-green","theme-black-blue","theme-black-white"];
    let currentThemeIndex = 0;
    function toggleTheme() {
      document.body.classList.remove(...themes);
      currentThemeIndex = (currentThemeIndex + 1) % themes.length;
      const theme = themes[currentThemeIndex];
      if (theme) {
        document.body.classList.add(theme);
        localStorage.setItem("theme", theme);
      } else {
        localStorage.removeItem("theme");
      }
    }
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.body.classList.add(savedTheme);
      currentThemeIndex = themes.indexOf(savedTheme);
    }
  </script>
</body>
</html>
