<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>闹钟 | 多功能工具箱</title>
  <link rel="icon" href="../chest.png" type="image/png">
  <link rel="stylesheet" href="../style.css">
  <style>
    .alarm-container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 2rem;
      background: var(--card-bg-dark);
      border-radius: 16px;
      border: 1px solid var(--border-dark);
      box-shadow: var(--shadow);
    }
    
    .time-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 1.2rem;
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      background: var(--bg-dark);
      color: inherit;
      margin: 1rem 0;
      text-align: center;
    }
    
    .time-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    
    .status-box {
      padding: 1rem;
      margin: 1.5rem 0;
      background: rgba(37, 99, 235, 0.1);
      border-radius: 8px;
      border-left: 4px solid var(--primary);
    }
    
    .control-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2rem;
    }
    
    .alarm-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    
    .current-time {
      font-size: 1.5rem;
      font-family: 'LED', monospace;
      color: var(--primary-light);
      margin: 1rem 0;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      border: 2px solid var(--border-dark);
    }
  </style>
</head>
<body>
  <div class="alarm-container">
    <div class="alarm-icon">⏰</div>
    <h1>闹钟设置</h1>
    <p>设置您想要提醒的时间，闹钟会在指定时间响起。</p>
    
    <div class="current-time" id="currentTime"></div>
    
    <label for="alarmTime"><strong>选择闹钟时间：</strong></label>
    <input type="time" id="alarmTime" class="time-input">
    
    <div class="control-buttons">
      <button onclick="setAlarm()" class="btn" style="background: var(--primary); color: white;">设置闹钟</button>
      <button onclick="clearAlarm()" class="btn" style="background: var(--danger); color: white;">清除闹钟</button>
    </div>
    
    <div class="status-box">
      <p id="status">尚未设置闹钟</p>
    </div>
    
    <div class="control-buttons">
      <button onclick="toggleTheme()" class="btn">切换主题</button>
      <a href="../index.html"><button class="btn back-button">返回主页</button></a>
    </div>
  </div>
  
  <audio id="alarmSound" src="../sounds/beep.mp3" preload="auto"></audio>
  <script>
    let alarmTime = null;
    let alarmTriggered = false;

    // 更新当前时间显示
    function updateCurrentTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById("currentTime").textContent = `${hours}:${minutes}:${seconds}`;
    }
    
    setInterval(updateCurrentTime, 1000);
    updateCurrentTime();

    function setAlarm() {
      const input = document.getElementById('alarmTime').value;
      if (!input) {
        alert("请选择闹钟时间！");
        return;
      }
      alarmTime = input;
      alarmTriggered = false;
      document.getElementById("status").innerHTML = `<strong>✅ 已设置闹钟：${alarmTime}</strong><br><small>闹钟将在指定时间响起</small>`;
      document.getElementById("status").style.color = "var(--success)";
    }
    
    function clearAlarm() {
      alarmTime = null;
      alarmTriggered = false;
      document.getElementById("status").textContent = "闹钟已清除";
      document.getElementById("status").style.color = "var(--danger)";
    }

    setInterval(() => {
      if (!alarmTime || alarmTriggered) return;
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const currentTime = `${hours}:${minutes}`;
      if (currentTime === alarmTime) {
        document.getElementById("alarmSound").play();
        document.getElementById("status").innerHTML = `<strong>🔔 闹钟响了！</strong><br><small>点击清除闹钟</small>`;
        document.getElementById("status").style.color = "var(--warning)";
        alarmTriggered = true;
        
        // 添加震动效果
        document.querySelector(".alarm-container").style.animation = "shake 0.5s";
        setTimeout(() => {
          document.querySelector(".alarm-container").style.animation = "";
        }, 500);
      }
    }, 1000);
    
    // 添加震动动画
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
      }
    `;
    document.head.appendChild(style);

    let themes = ["theme-white-blue", "theme-white-red", "theme-white-black", "theme-black-green","theme-black-blue","theme-black-white"];
    let currentThemeIndex = 0;
    function toggleTheme() {
      document.body.classList.remove(...themes);
      currentThemeIndex = (currentThemeIndex + 1) % themes.length;
      const theme = themes[currentThemeIndex];
      if (theme) {
        document.body.classList.add(theme);
        localStorage.setItem("theme", theme);
      } else {
        localStorage.removeItem("theme");
      }
    }
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.body.classList.add(savedTheme);
      currentThemeIndex = themes.indexOf(savedTheme);
    }
  </script>
</body>
</html>
