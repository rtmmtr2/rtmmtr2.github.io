
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>闹钟</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1>闹钟功能</h1>
  <input type="time" id="alarmTime">
  <button onclick="addAlarm()">添加闹钟</button>
  <ul id="alarmList"></ul>
  <audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>
  <button onclick="toggleTheme()">切换主题</button>
  <div style="margin-top: 2em;"><a href="../index.html"><button>返回主页</button></a></div>
  <script>
    let alarms = [];
    function addAlarm() {
      const time = document.getElementById("alarmTime").value;
      if (time && !alarms.includes(time)) {
        alarms.push(time);
        updateAlarmList();
      }
    }
    function removeAlarm(t) {
      alarms = alarms.filter(a => a !== t);
      updateAlarmList();
    }
    function updateAlarmList() {
      const ul = document.getElementById("alarmList");
      ul.innerHTML = "";
      alarms.forEach(t => {
        const li = document.createElement("li");
        li.innerHTML = `${t} <button onclick="removeAlarm('${t}')">删除</button>`;
        ul.appendChild(li);
      });
    }
    function checkAlarms() {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      const bj = new Date(utc + 8 * 3600000);
      const h = String(bj.getHours()).padStart(2, '0');
      const m = String(bj.getMinutes()).padStart(2, '0');
      const current = `${h}:${m}`;
      if (alarms.includes(current)) {
        document.getElementById("alarmSound").play();
        alert("闹钟响了：" + current);
        // 不移除，继续每天响，可根据需要修改
      }
    }
    setInterval(checkAlarms, 1000);
    let themes = ["", "light", "blue", "light-blue", "light-black"];
    let currentThemeIndex = 0;
    function toggleTheme() {
      document.body.classList.remove(...themes);
      currentThemeIndex = (currentThemeIndex + 1) % themes.length;
      if (themes[currentThemeIndex]) {
        document.body.classList.add(themes[currentThemeIndex]);
      }
    }
  </script>
</body>
</html>
