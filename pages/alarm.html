<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>闹钟</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1>设置闹钟</h1>
  <input type="time" id="alarmTime">
  <button onclick="setAlarm()">设置闹钟</button>
  <p id="status">尚未设置</p>
  <audio id="alarmSound" src="../sounds/beep.mp3" preload="auto"></audio>
  <button onclick="toggleTheme()">切换主题</button>
  <div><a href="../index.html"><button>返回主页</button></a></div>
  <script>
    let alarmTime = null;
    let alarmTriggered = false;

    function setAlarm() {
      const input = document.getElementById('alarmTime').value;
      if (!input) {
        alert("请输入时间！");
        return;
      }
      alarmTime = input;
      alarmTriggered = false;
      document.getElementById("status").textContent = "已设置闹钟：" + alarmTime;
    }

    setInterval(() => {
      if (!alarmTime || alarmTriggered) return;
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const currentTime = `${hours}:${minutes}`;
      if (currentTime === alarmTime) {
        document.getElementById("alarmSound").play();
        alert("时间到了！");
        alarmTriggered = true;
      }
    }, 1000);

    let themes = ["theme-white-blue", "theme-white-red", "theme-white-black", "theme-black-green","theme-black-blue","theme-black-white"];
    let currentThemeIndex = 0;
    function toggleTheme() {
      document.body.classList.remove(...themes);
      currentThemeIndex = (currentThemeIndex + 1) % themes.length;
      const theme = themes[currentThemeIndex];
      if (theme) {
        document.body.classList.add(theme);
        localStorage.setItem("theme", theme);
      } else {
        localStorage.removeItem("theme");
      }
    }
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.body.classList.add(savedTheme);
      currentThemeIndex = themes.indexOf(savedTheme);
    }
  </script>
</body>
</html>
