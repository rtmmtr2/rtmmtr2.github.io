<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>函数绘图</title>
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.min.js"></script>
  <link rel="stylesheet" href="../style.css">
  <style>
    canvas {
      border: 1px solid #333;
      background: #fff;
      margin-top: 10px;
    }
    #controls {
      margin-bottom: 10px;
    }
    input {
      width: 300px;
    }
    #info {
      white-space: pre-wrap;
      margin-top: 10px;
      background: rgba(255,255,255,0.8);
      padding: 8px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>函数绘图器</h1>
  <div id="controls">
    函数表达式 y = <input type="text" id="expression" placeholder="例如 sin(x) 或 x^2" value="sin(2x)">
    <button onclick="drawFunction()">绘图</button>
    <button onclick="toggleTheme()">切换主题</button>
    <a href="../index.html"><button>返回主页</button></a>
  </div>
  <canvas id="graph" width="800" height="400"></canvas>
  <div id="info"></div>

  <script>
    const canvas = document.getElementById("graph");
    const ctx = canvas.getContext("2d");
    const width = canvas.width;
    const height = canvas.height;
    const originX = width / 2;
    const originY = height / 2;
    const xScale = 40;
    const yScale = 40;

    function drawFunction() {
      const expr = document.getElementById("expression").value;
      let fn;
      try {
        fn = math.compile(expr);
      } catch (e) {
        alert("表达式有误，请重新输入！");
        return;
      }

      ctx.clearRect(0, 0, width, height);
      ctx.beginPath();
      ctx.moveTo(0, originY);
      ctx.lineTo(width, originY);
      ctx.moveTo(originX, 0);
      ctx.lineTo(originX, height);
      ctx.strokeStyle = "#000";
      ctx.stroke();

      ctx.beginPath();
      let started = false;
      for (let px = 0; px < width; px++) {
        const x = (px - originX) / xScale;
        let y;
        try {
          y = fn.evaluate({ x });
        } catch {
          continue;
        }
        const py = originY - y * yScale;
        if (!started) {
          ctx.moveTo(px, py);
          started = true;
        } else {
          ctx.lineTo(px, py);
        }
      }
      ctx.strokeStyle = "blue";
      ctx.lineWidth = 2;
      ctx.stroke();

      analyzeFunction(expr);
    }

    function analyzeFunction(expr) {
      let info = "";
      try {
        const intervals = getMonotonicIntervals(expr, -2 * Math.PI, 2 * Math.PI);
        const result = formatIntervals(intervals);
        info += `递增区间:\n${result.increasing.join('\n')}\n\n`;
        info += `递减区间:\n${result.decreasing.join('\n')}`;
      } catch (e) {
        info = "无法分析函数信息。";
      }
      document.getElementById("info").innerText = info;
    }

    function getMonotonicIntervals(expr, rangeStart = -10, rangeEnd = 10, steps = 2000) {
      const step = (rangeEnd - rangeStart) / steps;
      const xValues = [];
      const derivative = math.derivative(expr, 'x');
      const fn = math.compile(expr);
      const dfn = derivative.compile();

      for (let i = 0; i <= steps; i++) {
        const x = rangeStart + i * step;
        let dx;
        try {
          dx = dfn.evaluate({ x });
          if (!Number.isFinite(dx)) continue;
          xValues.push({ x, dx });
        } catch {
          continue;
        }
      }

      const intervals = [];
      let currentSign = Math.sign(xValues[0].dx);
      let intervalStart = xValues[0].x;

      for (let i = 1; i < xValues.length; i++) {
        const sign = Math.sign(xValues[i].dx);
        if (sign !== currentSign && sign !== 0) {
          intervals.push({
            sign: currentSign,
            from: intervalStart,
            to: xValues[i - 1].x
          });
          intervalStart = xValues[i].x;
          currentSign = sign;
        }
      }

      intervals.push({
        sign: currentSign,
        from: intervalStart,
        to: xValues[xValues.length - 1].x
      });

      return intervals;
    }

    function formatIntervals(intervals) {
      const toPi = x => {
        const frac = math.format(x / Math.PI, { fraction: 'ratio' });
        if (frac === '0') return '0';
        if (frac === '1') return 'π';
        if (frac === '-1') return '-π';
        return frac + 'π';
      };

      const output = { increasing: [], decreasing: [] };

      intervals.forEach(i => {
        const from = toPi(i.from);
        const to = toPi(i.to);
        const s = `[${from}, ${to}]`;
        if (i.sign > 0) output.increasing.push(s);
        else if (i.sign < 0) output.decreasing.push(s);
      });

      return output;
    }

    // 切换主题
    let themes = ["", "light", "blue", "light-blue", "light-black", "black-green", "black-white", "black-blue"];
    let currentThemeIndex = 0;
    function toggleTheme() {
      document.body.classList.remove(...themes);
      currentThemeIndex = (currentThemeIndex + 1) % themes.length;
      const theme = themes[currentThemeIndex];
      if (theme) {
        document.body.classList.add(theme);
        localStorage.setItem("theme", theme);
      } else {
        localStorage.removeItem("theme");
      }
    }

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.body.classList.add(savedTheme);
      currentThemeIndex = themes.indexOf(savedTheme);
    }

    drawFunction();
  </script>
</body>
</html>
