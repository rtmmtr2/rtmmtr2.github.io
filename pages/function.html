<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>函数绘图</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
  <h1>函数绘图</h1>

  <input type="text" id="functionInput" placeholder="输入函数，例如 sin(x), cos(x), x^2" />
  <button onclick="drawGraph()">绘图</button>
  <button onclick="cycleTheme()">切换主题</button>
  <button onclick="location.href='index.html'">返回主页</button>

  <div id="graph" style="width:100%;height:400px;margin-top:20px;"></div>
  <div id="info"></div>

  <script>
    let themes = ["theme-white-blue", "theme-white-red", "theme-white-black", "theme-black-green","theme-black-blue","theme-black-white"];
    let currentThemeIndex = 0;
    function toggleTheme() {
      document.body.classList.remove(...themes);
      currentThemeIndex = (currentThemeIndex + 1) % themes.length;
      const theme = themes[currentThemeIndex];
      if (theme) {
        document.body.classList.add(theme);
        localStorage.setItem("theme", theme);
      } else {
        localStorage.removeItem("theme");
      }
    }

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.body.classList.add(savedTheme);
      currentThemeIndex = themes.indexOf(savedTheme);
    }

    function formatPiFraction(value, tolerance = 0.01) {
      const pi = Math.PI;
      const ratio = value / pi;
      for (let d = 1; d <= 24; d++) {
        let n = Math.round(ratio * d);
        if (Math.abs(n / d - ratio) < tolerance) {
          if (n === 0) return "0";
          if (d === 1) return n === 1 ? "π" : `${n}π`;
          if (n === 1) return `π/${d}`;
          return `${n}π/${d}`;
        }
      }
      return value.toFixed(3);
    }

    function drawGraph() {
      const expr = document.getElementById("functionInput").value;
      const x = [], y = [];
      const mathExpr = expr.replaceAll('^', '**');
      const fn = new Function('x', `return ${mathExpr};`);

      for (let i = -10; i <= 10; i += 0.01) {
        try {
          x.push(i);
          y.push(fn(i));
        } catch {
          x.push(i);
          y.push(null);
        }
      }

      Plotly.newPlot('graph', [{ x, y, type: 'scatter', mode: 'lines', name: expr }],
        { margin: { t: 20 } });

      analyzeFunction(fn);
    }

    function analyzeFunction(fn) {
      let info = "";

      try {
        // 周期性检测：f(x) ≈ f(x + T)
        const sampleX = 1;
        const f1 = fn(sampleX);
        let T = null;
        for (let t = 0.1; t <= 10; t += 0.01) {
          const diff = Math.abs(fn(sampleX + t) - f1);
          if (diff < 0.01) {
            T = t;
            break;
          }
        }
        if (T) info += `最小正周期 T ≈ ${formatPiFraction(T)}<br/>`;

        // 单调区间检测
        let increasing = [], decreasing = [], last = fn(-10), start = -10;
        for (let i = -10; i <= 10; i += 0.2) {
          const curr = fn(i);
          if (curr > last) {
            if (decreasing.length && i - decreasing[decreasing.length - 1][1] > 0.5)
              decreasing.push([start, i]);
            start = i;
            last = curr;
          } else if (curr < last) {
            if (increasing.length && i - increasing[increasing.length - 1][1] > 0.5)
              increasing.push([start, i]);
            start = i;
            last = curr;
          }
        }

        if (increasing.length)
          info += "单调递增区间：" + increasing.map(p => `[${p[0].toFixed(1)}, ${p[1].toFixed(1)}]`).join(" ") + "<br/>";
        if (decreasing.length)
          info += "单调递减区间：" + decreasing.map(p => `[${p[0].toFixed(1)}, ${p[1].toFixed(1)}]`).join(" ") + "<br/>";

        // 对称性检测
        const f0 = fn(0);
        const symmetric = Math.abs(fn(-1) - fn(1)) < 0.01;
        if (symmetric) info += "关于 y 轴对称<br/>";

        const center = fn(2) + fn(-2) - 2 * f0;
        if (Math.abs(center) < 0.01) info += "关于原点中心对称<br/>";
      } catch {
        info += "函数分析失败。";
      }

      document.getElementById("info").innerHTML = info;
    }
  </script>
</body>
</html>
