<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>函数绘图</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11/lib/browser/math.js"></script>
</head>
<body onload="applyTheme()">
  <div class="top-bar">
    <select id="theme-selector" onchange="setTheme(this.value)">
      <option value="white-blue">白底蓝字</option>
      <option value="white-black">白底黑字</option>
      <option value="white-red">白底红字</option>
      <option value="black-green">黑底绿字</option>
      <option value="black-white">黑底白字</option>
      <option value="black-blue">黑底蓝字</option>
    </select>
  </div>

  <h1>函数绘图</h1>
  <input type="text" id="expression" placeholder="请输入函数，如 sin(x), x^2 等" />
  <button onclick="drawFunction()">绘图</button>
  <a href="../index.html"><button>返回主页</button></a>
  <canvas id="graph" width="600" height="400"></canvas>

  <div id="analysis">
    <h3>函数分析结果</h3>
    <p id="period">最小正周期：--</p>
    <p id="monotonicity">单调性：--</p>
    <p id="inc-intervals">单调递增区间：--</p>
    <p id="dec-intervals">单调递减区间：--</p>
    <p id="symmetry">对称性：--</p>
  </div>

  <script src="../theme.js"></script>
  <script>
    let myChart = null;

    function drawFunction() {
      const exprStr = document.getElementById("expression").value;
      if (!exprStr) return;

      try {
        const compiled = math.compile(exprStr);
        const labels = [];
        const data = [];

        for (let x = -10; x <= 10; x += 0.1) {
          labels.push(x.toFixed(2));
          let y = compiled.evaluate({ x });
          data.push(Number.isFinite(y) ? y : null);
        }

        const ctx = document.getElementById("graph").getContext("2d");
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
          type: "line",
          data: {
            labels: labels,
            datasets: [{
              label: exprStr,
              data: data,
              borderColor: "blue",
              fill: false,
              tension: 0.1
            }]
          },
          options: {
            scales: {
              x: { title: { display: true, text: "x" }},
              y: { title: { display: true, text: "f(x)" }}
            }
          }
        });

        analyzeFunction(exprStr);
      } catch (err) {
        alert("函数解析错误：" + err.message);
      }
    }

    function analyzeFunction(exprStr) {
      try {
        const compiled = math.compile(exprStr);
        const f = x => compiled.evaluate({ x });

        const xVals = [];
        const yVals = [];
        for (let x = -10; x <= 10; x += 0.1) {
          xVals.push(x);
          yVals.push(f(x));
        }

        // 周期估算
        let period = "--";
        for (let t = 0.1; t < 20; t += 0.1) {
          let match = true;
          for (let x = -5; x < 5; x += 0.1) {
            if (Math.abs(f(x) - f(x + t)) > 0.01) {
              match = false;
              break;
            }
          }
          if (match) {
            period = t.toFixed(2);
            break;
          }
        }

        // 单调性区间
        let incIntervals = [], decIntervals = [];
        let start = xVals[0];
        let increasing = null;

        for (let i = 1; i < xVals.length; i++) {
          const x0 = xVals[i - 1], x1 = xVals[i];
          const y0 = yVals[i - 1], y1 = yVals[i];

          let current = y1 > y0 ? 'inc' : y1 < y0 ? 'dec' : null;
          if (current !== increasing) {
            if (increasing === 'inc') incIntervals.push([start, x0]);
            else if (increasing === 'dec') decIntervals.push([start, x0]);
            start = x0;
            increasing = current;
          }
        }
        if (increasing === 'inc') incIntervals.push([start, xVals[xVals.length - 1]]);
        if (increasing === 'dec') decIntervals.push([start, xVals[xVals.length - 1]]);

        const formatIntervals = arr => arr.map(([a, b]) => `[${a.toFixed(1)}, ${b.toFixed(1)}]`).join("，");

        // 单调性总体
        let mono = incIntervals.length > decIntervals.length ? "增函数" :
                   decIntervals.length > incIntervals.length ? "减函数" : "不单调";

        // 对称性
        let symmetry = "不确定";
        for (let c = -5; c <= 5; c += 0.5) {
          let even = true, odd = true;
          for (let x = -5; x <= 5; x += 0.2) {
            if (Math.abs(f(c + x) - f(c - x)) > 0.05) even = false;
            if (Math.abs(f(c + x) + f(c - x)) > 0.05) odd = false;
          }
          if (even) {
            symmetry = `轴对称（对称轴：x=${c}）`;
            break;
          } else if (odd) {
            symmetry = `中心对称（中心：(${c}, ${f(c).toFixed(2)})）`;
            break;
          }
        }

        document.getElementById("period").innerText = "最小正周期：" + period;
        document.getElementById("monotonicity").innerText = "单调性：" + mono;
        document.getElementById("inc-intervals").innerText = "单调递增区间：" + formatIntervals(incIntervals);
        document.getElementById("dec-intervals").innerText = "单调递减区间：" + formatIntervals(decIntervals);
        document.getElementById("symmetry").innerText = "对称性：" + symmetry;
      } catch (err) {
        console.warn("函数分析失败：", err.message);
      }
    }

    // 主题切换
    function applyTheme() {
      const theme = localStorage.getItem("theme") || "white-blue";
      document.body.className = theme;
      document.getElementById("theme-selector").value = theme;
    }

    function setTheme(theme) {
      localStorage.setItem("theme", theme);
      document.body.className = theme;
    }
  </script>
</body>
</html>
